[[rules]]
  id = "generic-api-key"
  description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
  regex = '''(?i)(?P<key>[a-z0-9-_\.]{8,64})(?:['|"]?:\s?['|"]?)(?P<secret>[a-z0-9-_\.]{8,128})['|"]?'''
  entropy = 3.5

    [[rules.allowlists]]
      description = "Allow internal variables and placeholders in translations and models"
      regexes = [
          '_ping_unsub',
          'presence_poll_interval',
          'reduced_polling',
          'REDUCED_POLLING',
          'REDACTED',
          'heatingPower',
          'action_provider',
          '_learned_window'
      ]
      paths = [
          'custom_components/hdg_boiler/translations/.*',
          'custom_components/hdg_boiler/models.py'
      ]

    [[rules.allowlists]]
      description = "Allow Python helper function names used as dict values in definitions.py"
      regexes = ['_with_group']
      paths = ['custom_components/hdg_boiler/definitions.py']
