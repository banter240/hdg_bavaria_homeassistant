# Reusable GitHub Actions workflow for checking that the per-circuit
# translation blocks match the Python enum maps and definitions. The script
# is pure standard library, so no dependency install is needed.

name: "Translations"

on:
  workflow_call:

jobs:
  translation-validation:
    name: "Validate Translations"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: "Check translation consistency"
        run: python scripts/check_translation_consistency.py
