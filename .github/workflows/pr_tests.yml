name: PR Tests

on:
  pull_request:
    branches: ['dev', 'main']
    paths:
      - 'custom_components/hdg_boiler/**'
      - 'scripts/check_translation_consistency.py'
      - '.github/workflows/pr_tests.yml'

jobs:
  lint:
    name: "Run Linter"
    uses: ./.github/workflows/lint.yml

  validation:
    name: "Run Validation"
    uses: ./.github/workflows/validate.yml

  # Job 3: Check per-circuit translations against the Python sources.
  translation-validation:
    name: "Validate Translations"
    uses: ./.github/workflows/translations.yml
