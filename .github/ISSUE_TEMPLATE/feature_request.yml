name: Feature Request (English)
description: Suggest a new feature or improvement
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before You Submit
        - Check [existing issues](https://github.com/banter240/hdg_bavaria_homeassistant/issues)
          and [discussions](https://github.com/banter240/hdg_bavaria_homeassistant/discussions).
          Someone might have already requested this.

  - type: textarea
    id: problem
    attributes:
      label: What Problem Does This Solve?
      description: Describe the use case or limitation you're running into. The more concrete, the better.
      placeholder: "e.g. I want to automate X but currently there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds you've tried, or other approaches that could solve this?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, links, node IDs, or anything else that helps illustrate the request.
    validations:
      required: false
