[tool.mypy]
platform = "linux"
python_version = "3.14"
follow_imports = "normal"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["testing_config/", "dev/", "tests/"]

# Project metadata lives in custom_components/hdg_boiler/manifest.json
# (owned by semantic-release) and hacs.json. This is an unpackaged Home
# Assistant custom component: dev tool pins are in requirements.txt.
